<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>زر تنقل مبسط جداً (800x100)</title>
    <style>
        /* CSS نقي ومباشر بدون أي مكتبات أو روابط خارجية */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #090d16;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        /* شريط التحكم الرئيسي بأبعاد 800 بكسل × 100 بكسل */
        .controller-wrapper {
            width: 100%;
            max-width: 800px;
            height: 100px;
            position: relative;
        }

        .nav-bar {
            position: relative;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 36px;
            cursor: pointer;
            touch-action: none;
            backdrop-filter: blur(16px);
            transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        }

        .nav-bar:hover {
            border-color: rgba(255, 255, 255, 0.15);
            background: rgba(15, 23, 42, 0.8);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
        }

        /* أسهم الأطراف للضغط */
        .side-arrow {
            font-size: 28px;
            color: rgba(255, 255, 255, 0.25);
            font-weight: 300;
            pointer-events: none;
            transition: color 0.2s ease, transform 0.2s ease;
            z-index: 2;
        }

        .nav-bar:hover .side-arrow {
            color: rgba(255, 255, 255, 0.6);
        }

        /* المقبض العريض والأملس في المنتصف (عرض 420 بكسل × ارتفاع 60 بكسل) */
        .simple-drag-pill {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 420px;
            height: 60px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1), background 0.2s ease, border-color 0.2s ease;
            z-index: 5;
        }

        .nav-bar:hover .simple-drag-pill {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.12);
        }

        /* علامات السحب الضمنية: 3 نقاط فائقة البساطة */
        .pill-dot {
            width: 6px;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transition: background-color 0.2s ease;
        }

        .nav-bar:hover .pill-dot {
            background-color: rgba(255, 255, 255, 0.6);
        }

        /* إضاءة خلفية ناعمة عند السحب */
        .drag-active-glow {
            position: absolute;
            inset: 0;
            border-radius: 50px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
            background: radial-gradient(circle at center, rgba(56, 189, 248, 0.12), transparent 70%);
        }
    </style>
</head>
<body>

    <!-- شريط التحكم الرئيسي بمفرده (800x100 بكسل) -->
    <div class="controller-wrapper">
        <div class="nav-bar" id="controller">
            
            <div class="drag-active-glow" id="active-glow"></div>

            <!-- سهم الضغط الأيمن -->
            <span class="side-arrow">‹</span>

            <!-- المقبض العريض والأملس في المنتصف (420px) -->
            <div class="simple-drag-pill" id="drag-pill">
                <div class="pill-dot"></div>
                <div class="pill-dot"></div>
                <div class="pill-dot"></div>
            </div>

            <!-- سهم الضغط الأيسر -->
            <span class="side-arrow">›</span>
        </div>
    </div>

    <script>
        let isDragging = false;
        let startX = 0;
        let dragDistance = 0;
        const SWIPE_THRESHOLD = 30; // المسافة الفاصلة بين الضغط والسحب (بكسل)

        const controller = document.getElementById('controller');
        const dragPill = document.getElementById('drag-pill');
        const activeGlow = document.getElementById('active-glow');

        // أحداث اللمس والماوس
        function handleStart(e) {
            isDragging = true;
            startX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            dragDistance = 0;
        }

        function handleMove(e) {
            if (!isDragging) return;
            const currentX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            dragDistance = currentX - startX;

            // تحريك المقبض العريض بنعومة مع حد أقصى
            const boundedX = Math.max(Math.min(dragDistance * 0.5, 140), -140);
            dragPill.style.transform = `translate(calc(-50% + ${boundedX}px), -50%)`;

            // إظهار إضاءة خلفية ناعمة أثناء السحب
            activeGlow.style.opacity = Math.min(Math.abs(dragDistance) / 80, 1);
        }

        function handleEnd() {
            if (!isDragging) return;
            isDragging = false;

            // إعادة المقبض للمنتصف بسلاسة
            dragPill.style.transform = 'translate(-50%, -50%)';
            activeGlow.style.opacity = '0';

            if (Math.abs(dragDistance) >= SWIPE_THRESHOLD) {
                // حدث سحب (Swipe)
                if (dragDistance > 0) {
                    console.log("انتقال للبطاقة السابقة (سحب لليمين)");
                } else {
                    console.log("انتقال للبطاقة التالية (سحب لليسار)");
                }
            } else {
                // حدث ضغطة سريعة (Click)
                const rect = controller.getBoundingClientRect();
                const clickX = startX - rect.left;

                if (clickX < rect.width / 2) {
                    console.log("انتقال للبطاقة السابقة (نقر أيسر)");
                } else {
                    console.log("انتقال للبطاقة التالية (نقر أيمن)");
                }
            }
        }

        // ربط الأحداث
        controller.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);

        controller.addEventListener('touchstart', handleStart, { passive: true });
        window.addEventListener('touchmove', handleMove, { passive: true });
        window.addEventListener('touchend', handleEnd);
    </script>
</body>
</html>
